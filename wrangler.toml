name = "azad-gw"
main = "dist/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Local/dev namespace. Replace id after the first `wrangler deploy` if you
# deploy to an account (wrangler prints the new namespace id).
[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"

[vars]
# Panel brand shown in the admin UI / portal (user facing, harmless).
BRAND = "Azad"
# Optional: pin a known admin-panel path on FIRST boot (e.g. "my-console-7x").
# Without it a random "console-xxxx" path is generated once and stored in KV.
# After the first boot the path saved in KV wins — change it from the panel.
# ADMIN_PATH = "my-console-7x"
